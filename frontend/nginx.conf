server {
    listen 80;
    root /usr/share/nginx/html;

    # Only document uploads may send large bodies (10 MB per file, ADR 0003); every other
    # API route keeps nginx's 1 MB default.
    location ~ ^/api/applicant/applications/[0-9]+/documents$ {
        client_max_body_size 11m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Above the API's own 15 s assistant budget (ASSISTANT_TIMEOUT_SECONDS), so a slow
        # answer reaches the client as the API's 504 ASSISTANT_TIMEOUT JSON, not an nginx page.
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
