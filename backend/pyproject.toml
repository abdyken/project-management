[project]
name = "admissions-backend"
version = "0.1.0"
description = "Backend API for the university admissions portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26,<3",
    "pgvector>=0.3.6",
    "fastembed>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
