services:
  db:
    # Postgres 16 with the pgvector extension available (not enabled) for the assistant module
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admissions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admissions}
      POSTGRES_DB: ${POSTGRES_DB:-admissions}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-admissions}:${POSTGRES_PASSWORD:-admissions}@db:5432/${POSTGRES_DB:-admissions}
      APP_ENV: ${APP_ENV:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
