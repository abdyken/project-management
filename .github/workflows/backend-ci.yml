name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admissions
          POSTGRES_PASSWORD: admissions
          POSTGRES_DB: admissions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admissions -d admissions"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://admissions:admissions@localhost:5432/admissions
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('backend/app/assistant/embeddings.py') }}
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest
