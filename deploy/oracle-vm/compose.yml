# SDU Admissions Portal on the Oracle Always Free VM (1 GB RAM + 2 GB swap).
# Deployed by .github/workflows/deploy.yml through deploy.sh; see README.md.
name: sdu-admissions

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB
    environment:
      POSTGRES_USER: admissions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: admissions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissions -d admissions"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: sdu-admissions-api:${APP_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://admissions:${POSTGRES_PASSWORD}@db:5432/admissions
      CORS_ORIGINS: https://${SITE_HOST:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APPLICANT_ACCOUNTS_ENABLED: ${APPLICANT_ACCOUNTS_ENABLED:-false}
      PUBLIC_BASE_URL: https://${SITE_HOST}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-admissions@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: sdu-admissions-web:${APP_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
